name: lingoria

services:
  airflow-init:
    image: ${AIRFLOW_IMAGE:-apache/airflow:latest-python3.10}
    user: "${AIRFLOW_UID:-50000}:0"
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-LocalExecutor}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow_service_change_me}@${AIRFLOW_DB_HOST:-postgres}:${AIRFLOW_DB_PORT:-5432}/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW_DAGS_ARE_PAUSED_AT_CREATION:-true}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES:-false}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_SIMPLE_AUTH_USERS:-admin:admin}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json.generated
      AIRFLOW__API__HOST: 0.0.0.0
      AIRFLOW__API__PORT: 8080
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      MINIO_ENDPOINT: ${AIRFLOW_MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${AIRFLOW_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_change_me}
    volumes: &airflow-common-volumes
      - ${AIRFLOW_DAGS_VOLUME_NAME:-airflow_dags}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_VOLUME_NAME:-airflow_logs}:/opt/airflow/logs
      - ${AIRFLOW_AUTH_VOLUME_NAME:-airflow_auth_data}:/opt/airflow/auth
    entrypoint: /bin/bash
    restart: "no"
    command:
      - -c
      - |
        mkdir -p /opt/airflow/auth /opt/airflow/logs /opt/airflow/dags
        PW_FILE="/opt/airflow/auth/simple_auth_manager_passwords.json.generated"
        if [ ! -f "$$PW_FILE" ]; then
          ADMIN_USER="${AIRFLOW_ADMIN:-admin}"
          IFS="-" read -r a b c d e < /proc/sys/kernel/random/uuid
          GEN_PW="$${a}$${b}$${c}$${d}"
          echo "{\"$${ADMIN_USER}\": \"$${GEN_PW}\"}" > "$$PW_FILE"
          chmod 644 "$$PW_FILE"
        fi
        airflow db migrate
    networks:
      - lingoria_network

  airflow-api-server:
    image: ${AIRFLOW_IMAGE:-apache/airflow:latest-python3.10}
    container_name: lingoria-airflow-api-server
    user: "${AIRFLOW_UID:-50000}:0"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: api-server
    ports:
      - "${AIRFLOW_API_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    logging: &airflow-logging
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - lingoria_network

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE:-apache/airflow:latest-python3.10}
    container_name: lingoria-airflow-scheduler
    user: "${AIRFLOW_UID:-50000}:0"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler
    ports:
      - "${AIRFLOW_SCHEDULER_HEALTH_PORT:-8974}:8974"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *airflow-logging
    networks:
      - lingoria_network

  airflow-dag-processor:
    image: ${AIRFLOW_IMAGE:-apache/airflow:latest-python3.10}
    container_name: lingoria-airflow-dag-processor
    user: "${AIRFLOW_UID:-50000}:0"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *airflow-logging
    networks:
      - lingoria_network

volumes:
  airflow_logs:
    name: ${AIRFLOW_LOGS_VOLUME_NAME:-airflow_logs}
  airflow_auth_data:
    name: ${AIRFLOW_AUTH_VOLUME_NAME:-airflow_auth_data}
  airflow_dags:
    name: ${AIRFLOW_DAGS_VOLUME_NAME:-airflow_dags}

networks:
  lingoria_network:
    name: ${COMPOSE_NETWORK:-lingoria_network}
    external: true
