name: lingoria

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: ${POSTGRES_CONTAINER_NAME:-lingoria-postgres}
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -c
      - |
        PW_FILE="/var/lib/postgresql/data/.admin_password"
        if [ ! -f "$$PW_FILE" ]; then
          mkdir -p /var/lib/postgresql/data
          IFS="-" read -r a b c d e < /proc/sys/kernel/random/uuid
          echo "$${a}$${b}$${c}$${d}" > "$$PW_FILE"
          chmod 644 "$$PW_FILE"
        fi
        export POSTGRES_PASSWORD=$$(cat "$$PW_FILE")
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-${POSTGRES_USER:-postgres}}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ${POSTGRES_VOLUME_NAME:-lingoria_postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      lingoria_network:
        aliases:
          - postgres

volumes:
  lingoria_postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-lingoria_postgres_data}

networks:
  lingoria_network:
    name: ${COMPOSE_NETWORK:-lingoria_network}
    external: true
